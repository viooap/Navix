<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavixTracker - Team</title>
    <!-- Hubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk ikon media sosial modern -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts untuk tipografi yang clean -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR UTAMA (Sesuai Gambar) -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Bagian Kiri: Logo dan Deskripsi -->
            <div class="nav-brand">
                <div class="brand-logo">
                    <!-- Ganti gambar ini dengan logo asli NavixTracker Anda jika ada -->
                    <img src="https://placeholder.com" alt="NavixTracker Logo">
                </div>
                <div class="brand-text">
                    <h2 class="brand-name">Navix<span>Tracker</span></h2>
                    <p class="brand-sub">Real-time ESP32 & GPS</p>
                </div>
            </div>

            <!-- Bagian Kanan: Menu Navigasi -->
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Utama</a></li>
                <li><a href="#" class="nav-link active">Team</a></li>
                <li><a href="/riwayat/" class="nav-link">Riwayat</a></li>
                <li><a href="#" class="nav-link">Pengaturan</a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENT SECTION (Team) -->
    <section class="team-section">
        <div class="header-container">
            <span class="sub-title">Kenali Lebih Dekat</span>
            <h1 class="section-title">Para Anggota Tim</h1>
            <div class="title-line"></div>
        </div>
        
        <div class="team-container">
            <!-- Card 1 -->
            <div class="profile-card">
                <div class="image-wrapper">
                    <img src="https://unsplash.com" alt="Siti Aminah">
                </div>
                <div class="card-content">
                    <h3 class="member-name">Zaki Firduas</h3>
                    <p class="member-role">Project Manager</p>
                    <div class="social-links">
                        <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="#" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="profile-card">
                <div class="image-wrapper">
                    <img src="https://unsplash.com" alt="Budi Santoso">
                </div>
                <div class="card-content">
                    <h3 class="member-name">Valdio Yoel</h3>
                    <p class="member-role">Lead Developer</p>
                    <div class="social-links">
                        <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="#" class="social-icon" aria-label="X"><i class="fab fa-x-twitter"></i></a>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="profile-card">
                <div class="image-wrapper">
                    <img src="https://unsplash.com" alt="Dewi Lestari">
                </div>
                <div class="card-content">
                    <h3 class="member-name">Renaldi Nanda Pratama</h3>
                    <p class="member-role">UI/UX Designer</p>
                    <div class="social-links">
                        <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon" aria-label="Behance"><i class="fab fa-behance"></i></a>
                        <a href="#" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="profile-card">
                <div class="image-wrapper">
                    <img src="https://unsplash.com" alt="Rian Hidayat">
                </div>
                <div class="card-content">
                    <h3 class="member-name">Vio Aditya .P</h3>
                    <p class="member-role">DevOps Engineer</p>
                    <div class="social-links">
                        <a href="#" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
                        <a href="#" class="social-icon" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Hubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
